<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/enrol_icon.svg" />
    <title>Enrol Overseas - CRM Admin Portal</title>
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          if (originalFetch) {
            var activeFetch = originalFetch;
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return activeFetch;
              },
              set: function(v) {
                activeFetch = v;
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          console.warn("Unable to configure window.fetch setter:", e);
        }
      })();
    </script>
  </head>
  <body class="bg-slate-900 text-slate-100 antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
